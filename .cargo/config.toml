[env] # Where every build, the Nix build included, puts what it renders
CINQ_APPLICATIONS_DIR = { value = "target/Applications", relative = true } # App bundle, for builds for macOS
CINQ_SHARE_DIR = { value = "target/share", relative = true }               # Laid out as the share directory of a prefix
