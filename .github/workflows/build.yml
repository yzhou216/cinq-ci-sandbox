on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false # A failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#aarch64-darwin-cross && tar -cf cinq-aarch64-darwin-cross.tar -C result .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-darwin-cross.tar
          archive: false
