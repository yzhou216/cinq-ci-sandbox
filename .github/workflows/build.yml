on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false # Failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  packages: # Built on Ubuntu for Darwin and other distributions of GNU/Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#aarch64-darwin-cross .#deb .#rpm .#archlinux
          tar -cf cinq-aarch64-darwin-cross.tar -C result .
          cp result-*/* .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-darwin-cross.tar
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
  install: # Packages installed, run, and removed on the distributions they are for
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:20.04 # Oldest glibc the packages support, 2.31
            install: rm /etc/dpkg/dpkg.cfg.d/excludes && apt-get update && apt-get install -y ./cinq_*.deb # Minimal image, which leaves out manual pages
            remove: apt-get remove -y cinq
          - image: debian:13
            install: apt-get update && apt-get install -y ./cinq_*.deb
            remove: apt-get remove -y cinq
          - image: fedora:latest
            install: dnf install -y ./cinq-*.rpm
            remove: dnf remove -y cinq
          - image: almalinux:9
            install: dnf install -y ./cinq-*.rpm
            remove: dnf remove -y cinq
          - image: archlinux:latest
            install: sed -i '/^NoExtract/d' /etc/pacman.conf && pacman -Sy --noconfirm && pacman -U --noconfirm ./cinq-*.pkg.tar.zst # Image leaves out manual pages too
            remove: pacman -R --noconfirm cinq
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@main
        with:
          name: packages
      - run: ${{ matrix.install }}
      - run: cinq --version && test -f /usr/share/man/man1/cinq.1 && test -f /usr/share/applications/cinq.desktop
      - run: ${{ matrix.remove }} && test ! -e /usr/bin/cinq
