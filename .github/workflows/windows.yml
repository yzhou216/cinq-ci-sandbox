# Cross-builds cinq for Windows on Ubuntu, then runs it on Windows on x64
# and on Arm, and screenshots its window
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#x86_64-windows-cross .#aarch64-windows-cross
          mkdir x86_64 aarch64
          cp result/bin/cinq.exe x86_64/
          cp result-1/bin/cinq.exe aarch64/
      - uses: actions/upload-artifact@main
        with:
          name: x86_64
          path: x86_64/cinq.exe
      - uses: actions/upload-artifact@main
        with:
          name: aarch64
          path: aarch64/cinq.exe
  try:
    needs: cross
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@main
        with:
          name: ${{ matrix.arch }}
      - shell: pwsh
        run: |
          $env:PROCESSOR_ARCHITECTURE
          # Program without a console of its own, whose output goes to a file
          Start-Process ./cinq.exe -ArgumentList "--version" -Wait -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          $cinq = Start-Process ./cinq.exe -PassThru
          Start-Sleep 15
          if ($cinq.HasExited) { "cinq exited with $($cinq.ExitCode)"; exit 1 }
          $cinq.Refresh()
          "window: $($cinq.MainWindowTitle)"
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class Window {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr window, out Rect rect);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr window, IntPtr context, uint flags);
          }
          "@
          $rect = New-Object Window+Rect
          [Window]::GetWindowRect($cinq.MainWindowHandle, [ref]$rect) | Out-Null
          $shot = New-Object System.Drawing.Bitmap ($rect.Right - $rect.Left), ($rect.Bottom - $rect.Top)
          $graphics = [System.Drawing.Graphics]::FromImage($shot)
          $context = $graphics.GetHdc()
          # Window as it draws itself, even under other windows
          [Window]::PrintWindow($cinq.MainWindowHandle, $context, 2) | Out-Null
          $graphics.ReleaseHdc($context)
          $shot.Save("$pwd\screen.png")
          Stop-Process $cinq
          if ($cinq.MainWindowTitle -ne "untitled - cinq") { exit 1 }
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: screen-${{ matrix.arch }}
          path: screen.png
          if-no-files-found: ignore
